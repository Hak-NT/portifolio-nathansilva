name: Ajuste final temporario do app.js

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir fluxo de confirmacao
        shell: python
        run: |
          from pathlib import Path

          p = Path('app.js')
          s = p.read_text(encoding='utf-8')
          original = s

          inicio = s.find('function confirmarCodigoVerificacao')
          if inicio == -1:
              raise SystemExit('Funcao confirmarCodigoVerificacao nao encontrada.')

          fim = s.find('\n}', inicio)
          trecho = s[inicio:] if fim == -1 else s[inicio:fim]

          marcador = 'estadoContato = "submitting";'
          posicao = s.find(marcador, inicio)
          if posicao != -1 and (fim == -1 or posicao < fim):
              s = s[:posicao] + 'estadoContato = "confirmandoCodigo";' + s[posicao + len(marcador):]
          else:
              assinatura_fim = s.find('{', inicio)
              if assinatura_fim == -1:
                  raise SystemExit('Assinatura da funcao de confirmacao invalida.')
              s = s[:assinatura_fim + 1] + '\n  estadoContato = "confirmandoCodigo";' + s[assinatura_fim + 1:]

          if 'estadoContato === "aguardandoCodigo" || estadoContato === "reenviandoCodigo"' in s:
              s = s.replace(
                  'estadoContato === "aguardandoCodigo" || estadoContato === "reenviandoCodigo"',
                  'estadoContato === "aguardandoCodigo" || estadoContato === "reenviandoCodigo" || estadoContato === "confirmandoCodigo"'
              )

          p.write_text(s, encoding='utf-8')

          if s == original:
              raise SystemExit('Nenhuma alteracao foi aplicada ao app.js.')
      - name: Validar JavaScript
        run: node --check app.js
      - name: Commitar e remover workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git diff --cached --quiet && { echo "Nenhuma alteracao para commitar."; exit 1; }
          git commit -m "Corrige processamento da confirmacao de codigo"
          rm -f .github/workflows/ajuste-final-temporario.yml
          git add -A .github/workflows/ajuste-final-temporario.yml
          git commit -m "Remove workflow temporario de ajuste"
          git push
