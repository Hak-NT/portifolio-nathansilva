name: Atualiza fluxo de contato temporario

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar app.js
        shell: python
        run: |
          from pathlib import Path

          p = Path('app.js')
          s = p.read_text(encoding='utf-8')

          # Corrige o atributo do botao de projeto.
          s = s.replace('abrirProjeto(openBtn.dataset.abrirProjeto);', 'abrirProjeto(openBtn.dataset.openProject);')

          marcador = 'function renderizarFormularioContato() {'
          inicio = s.find(marcador)
          fim = s.find('\nfunction renderizarContato() {', inicio)
          if inicio == -1 or fim == -1:
              raise SystemExit('Nao foi possivel localizar renderizarFormularioContato.')

          novo_formulario = r'''function escaparHtmlFormulario(textoOriginal) {
  return String(textoOriginal)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

async function enviarCodigoVerificacao() {
  try {
    const { data, error } = await bancoDeContatos.functions.invoke("verificar-email", {
      body: {
        etapa: "enviar",
        nome: valoresContato.name.trim(),
        email: valoresContato.email.trim().toLowerCase(),
        assunto: valoresContato.subject.trim(),
        mensagem: valoresContato.message.trim(),
      },
    });

    if (error) {
      console.error("Erro ao solicitar codigo de verificacao:", error);
      errosContato = { message: "Nao foi possivel enviar o codigo. Tente novamente." };
      return false;
    }

    if (!data?.sucesso) {
      errosContato = { message: data?.mensagem || "Nao foi possivel enviar o codigo." };
      return false;
    }

    return true;
  } catch (erro) {
    console.error("Erro inesperado ao solicitar codigo:", erro);
    errosContato = { message: "Nao foi possivel enviar o codigo. Tente novamente." };
    return false;
  }
}

async function confirmarCodigoVerificacao(codigoInformado) {
  try {
    const { data, error } = await bancoDeContatos.functions.invoke("verificar-email", {
      body: {
        etapa: "confirmar",
        email: valoresContato.email.trim().toLowerCase(),
        codigo: codigoInformado.trim(),
      },
    });

    if (error) {
      console.error("Erro ao confirmar codigo:", error);
      errosContato = { code: "Nao foi possivel confirmar o codigo. Tente novamente." };
      return false;
    }

    if (!data?.sucesso) {
      errosContato = { code: data?.mensagem || "Codigo incorreto." };
      return false;
    }

    return true;
  } catch (erro) {
    console.error("Erro inesperado ao confirmar codigo:", erro);
    errosContato = { code: "Nao foi possivel confirmar o codigo. Tente novamente." };
    return false;
  }
}

function mascararEmail(emailInformado) {
  const partesEmail = String(emailInformado).split("@");
  if (partesEmail.length !== 2) return emailInformado;
  const nomeEmail = partesEmail[0];
  const dominioEmail = partesEmail[1];
  if (nomeEmail.length <= 1) return `*@${dominioEmail}`;
  return `${nomeEmail[0]}***@${dominioEmail}`;
}

function renderizarFormularioContato() {
  const f = classesCampo();
  const nomeSeguro = escaparHtmlFormulario(valoresContato.name);
  const emailSeguro = escaparHtmlFormulario(valoresContato.email);
  const assuntoSeguro = escaparHtmlFormulario(valoresContato.subject);
  const mensagemSegura = escaparHtmlFormulario(valoresContato.message);

  if (estadoContato === "aguardandoCodigo" || estadoContato === "reenviandoCodigo" || estadoContato === "confirmandoCodigo") {
    const bloqueado = estadoContato === "confirmandoCodigo";
    const reenviando = estadoContato === "reenviandoCodigo";
    const erro = errosContato.code || errosContato.message || "";

    return `
      <form id="contact-verification-form" novalidate class="revelar space-y-5" aria-label="Confirmação de e-mail">
        <div class="rounded-3xl border border-line bg-panel p-6 sm:p-8">
          <div class="font-mono text-[11px] uppercase tracking-[0.2em] text-red">Confirmação</div>
          <h3 class="mt-3 font-display text-2xl font-bold">Confirme seu e-mail</h3>
          <p class="mt-3 text-sm leading-relaxed text-mist">Enviamos um código de 6 dígitos para <span class="text-white">${escaparHtmlFormulario(mascararEmail(valoresContato.email))}</span>.</p>
          <label for="codigo-verificacao" class="mt-6 mb-1.5 block font-mono text-[11px] uppercase tracking-[0.2em] text-mist">Código</label>
          <input id="codigo-verificacao" name="codigo-verificacao" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="000000" ${bloqueado ? "disabled" : ""} class="${f} text-center font-mono text-2xl tracking-[0.35em]" aria-invalid="${!!errosContato.code}" />
          <p class="mt-2 text-xs text-mist">O código é válido por 10 minutos.</p>
          ${erro ? `<p role="alert" class="mt-3 text-sm text-red">${escaparHtmlFormulario(erro)}</p>` : ""}
          <div class="mt-5 flex flex-wrap items-center gap-3">
            <button type="submit" ${bloqueado ? "disabled" : ""} class="group inline-flex items-center gap-3 rounded-full bg-red px-7 py-3.5 font-display font-semibold text-white transition-all duration-300 hover:gap-4 disabled:opacity-60">
              ${bloqueado ? `<span class="h-4 w-4 animate-spin rounded-full border-2 border-white/40 border-t-white"></span>Confirmando…` : `Confirmar e enviar<span class="grid h-6 w-6 place-items-center rounded-full bg-white/25">↗</span>`}
            </button>
            <button type="button" data-resend-code ${reenviando ? "disabled" : ""} class="rounded-full border border-line px-5 py-3.5 font-display text-sm font-semibold text-white transition-colors hover:border-red hover:text-red disabled:opacity-60">${reenviando ? "Reenviando…" : "Reenviar código"}</button>
          </div>
        </div>
      </form>`;
  }

  return `
  <form id="contact-form" novalidate class="revelar space-y-4" aria-label="Formulário de contato">
    <div class="grid gap-4 sm:grid-cols-2">
      <div>
        <label for="name" class="mb-1.5 block font-mono text-[11px] uppercase tracking-[0.2em] text-mist">Nome</label>
        <input id="name" name="name" value="${nomeSeguro}" placeholder="Seu nome" class="${f}" aria-invalid="${!!errosContato.name}" />
        ${errosContato.name ? `<p class="mt-1.5 text-xs text-red">${escaparHtmlFormulario(errosContato.name)}</p>` : ""}
      </div>
      <div>
        <label for="email" class="mb-1.5 block font-mono text-[11px] uppercase tracking-[0.2em] text-mist">E-mail</label>
        <input id="email" name="email" type="email" value="${emailSeguro}" placeholder="voce@email.com" class="${f}" aria-invalid="${!!errosContato.email}" />
        ${errosContato.email ? `<p class="mt-1.5 text-xs text-red">${escaparHtmlFormulario(errosContato.email)}</p>` : ""}
      </div>
    </div>
    <div>
      <label for="subject" class="mb-1.5 block font-mono text-[11px] uppercase tracking-[0.2em] text-mist">Assunto</label>
      <input id="subject" name="subject" value="${assuntoSeguro}" placeholder="Sobre o que vamos falar?" class="${f}" aria-invalid="${!!errosContato.subject}" />
      ${errosContato.subject ? `<p class="mt-1.5 text-xs text-red">${escaparHtmlFormulario(errosContato.subject)}</p>` : ""}
    </div>
    <div>
      <label for="message" class="mb-1.5 block font-mono text-[11px] uppercase tracking-[0.2em] text-mist">Mensagem</label>
      <textarea id="message" name="message" rows="6" placeholder="Conte sobre seu projeto…" class="${f} resize-none" aria-invalid="${!!errosContato.message}">${mensagemSegura}</textarea>
      ${errosContato.message ? `<p class="mt-1.5 text-xs text-red">${escaparHtmlFormulario(errosContato.message)}</p>` : ""}
    </div>
    <div class="flex flex-wrap items-center gap-4 pt-2">
      <button type="submit" ${estadoContato === "submitting" ? "disabled" : ""} class="group inline-flex items-center gap-3 rounded-full bg-red px-7 py-3.5 font-display font-semibold text-white transition-all duration-300 hover:gap-4 hover:shadow-[0_12px_40px_-10px_rgba(255,45,63,0.7)] active:scale-95 disabled:opacity-60">
        ${estadoContato === "submitting" ? `<span class="h-4 w-4 animate-spin rounded-full border-2 border-white/40 border-t-white"></span>Enviando…` : `Enviar mensagem<span class="grid h-6 w-6 place-items-center rounded-full bg-white/25 transition-transform group-hover:rotate-45">↗</span>`}
      </button>
      ${estadoContato === "success" ? `<span role="status" class="inline-flex items-center gap-2 text-sm text-green-400"><span class="grid h-5 w-5 place-items-center rounded-full bg-green-500 text-xs text-black">✓</span>Mensagem enviada — retorno em até 24h.</span>` : ""}
      ${estadoContato === "error" ? `<span role="alert" class="text-sm text-red">${escaparHtmlFormulario(errosContato.message || "Revise os campos destacados.")}</span>` : ""}
    </div>
  </form>`;
}
'''
          s = s[:inicio] + novo_formulario + s[fim:]

          inicio = s.find('function vincularFormularioContato() {')
          fim = s.find('\n/* ==================================================================== */\n/* Root render', inicio)
          if inicio == -1 or fim == -1:
              raise SystemExit('Nao foi possivel localizar vincularFormularioContato.')

          novo_vinculador = r'''function vincularFormularioContato() {
  const formularioContato = document.getElementById("contact-form");
  const formularioVerificacao = document.getElementById("contact-verification-form");

  if (formularioContato) {
    ["name", "email", "subject", "message"].forEach((campoFormulario) => {
      const campo = formularioContato.querySelector(`#${campoFormulario}`);
      if (!campo) return;
      campo.addEventListener("input", (evento) => {
        valoresContato[campoFormulario] = evento.target.value;
        if (estadoContato === "idle" || estadoContato === "error" || estadoContato === "success") estadoContato = "typing";
        errosContato[campoFormulario] = "";
      });
    });

    formularioContato.addEventListener("submit", async (evento) => {
      evento.preventDefault();
      errosContato = validarContato();
      if (Object.keys(errosContato).length > 0) {
        estadoContato = "error";
        atualizarFormularioContato();
        return;
      }
      estadoContato = "submitting";
      atualizarFormularioContato();
      const enviado = await enviarCodigoVerificacao();
      if (!enviado) {
        estadoContato = "error";
        atualizarFormularioContato();
        return;
      }
      errosContato = {};
      estadoContato = "aguardandoCodigo";
      atualizarFormularioContato();
    });
  }

  if (formularioVerificacao) {
    formularioVerificacao.addEventListener("submit", async (evento) => {
      evento.preventDefault();
      const campoCodigo = document.getElementById("codigo-verificacao");
      const codigoInformado = campoCodigo?.value.trim() || "";
      if (!/^\d{6}$/.test(codigoInformado)) {
        errosContato = { code: "Digite o código de 6 dígitos." };
        estadoContato = "aguardandoCodigo";
        atualizarFormularioContato();
        return;
      }
      errosContato = {};
      estadoContato = "confirmandoCodigo";
      atualizarFormularioContato();
      const confirmado = await confirmarCodigoVerificacao(codigoInformado);
      if (!confirmado) {
        estadoContato = "aguardandoCodigo";
        atualizarFormularioContato();
        return;
      }
      estadoContato = "success";
      valoresContato = { name: "", email: "", subject: "", message: "" };
      errosContato = {};
      atualizarFormularioContato();
    });

    document.querySelector("[data-resend-code]")?.addEventListener("click", async () => {
      estadoContato = "reenviandoCodigo";
      errosContato = {};
      atualizarFormularioContato();
      await enviarCodigoVerificacao();
      estadoContato = "aguardandoCodigo";
      atualizarFormularioContato();
    });
  }
}
'''
          s = s[:inicio] + novo_vinculador + s[fim:]

          p.write_text(s, encoding='utf-8')
      - name: Validar JavaScript
        run: node --check app.js
      - name: Commitar correcoes e remover workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git diff --cached --quiet && { echo "Nenhuma alteracao para commitar."; exit 1; }
          git commit -m "Atualiza verificacao de e-mail do formulario"
          rm -f .github/workflows/ajuste-final-temporario.yml
          git add -A .github/workflows/ajuste-final-temporario.yml
          git commit -m "Remove workflow temporario de ajuste"
          git push
